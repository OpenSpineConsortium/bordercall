<title>DRR Gap Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Instrument+Serif&display=swap">
<style>
/* Layout: a run sheet read top to bottom, the state first, then the pipeline as one strip, the
   readings and the tasks side by side, the units-done trace, and the raw progress lines last. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #18202c; --muted: #5c6878; --line: #dde2e9;
  --accent: #2f4fb8; --done: #1d8a63; --run: #c27a12; --fail: #c2362b; --wait: #a3acb8;
  --done-soft: #d9efe6; --run-soft: #f6e8cf; --fail-soft: #f6d9d6; --wait-soft: #e8ebf0;
  --display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151c; --panel: #181e27; --ink: #e6eaf0; --muted: #96a1b0; --line: #2a3340;
  --accent: #8ea5ff; --done: #4cc391; --run: #e8a640; --fail: #f07267; --wait: #6b7686;
  --done-soft: #183a2e; --run-soft: #3a2e17; --fail-soft: #3d1f1d; --wait-soft: #232a35; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151c; --panel: #181e27; --ink: #e6eaf0; --muted: #96a1b0; --line: #2a3340;
  --accent: #8ea5ff; --done: #4cc391; --run: #e8a640; --fail: #f07267; --wait: #6b7686;
  --done-soft: #183a2e; --run-soft: #3a2e17; --fail-soft: #3d1f1d; --wait-soft: #232a35; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--ui); }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { font: 400 2.3rem/1.1 var(--display); margin: 0; text-wrap: balance; }
h2 { font: 600 0.78rem/1 var(--ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.meta { color: var(--muted); font-size: 0.86rem; }
.meta b { color: var(--ink); font-weight: 600; }
.pill { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font: 600 0.8rem/1.4 var(--ui); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-done { color: var(--done); background: var(--done-soft); }
.s-running, .s-queued, .s-watching { color: var(--run); background: var(--run-soft); }
.s-failed, .s-stopped { color: var(--fail); background: var(--fail-soft); }
.s-waiting, .s-none, .s-finished { color: var(--muted); background: var(--wait-soft); }
.s-finished { color: var(--done); background: var(--done-soft); }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.note p { margin: 0; max-width: 72ch; }
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.figure { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.figure .n { font: 600 1.9rem/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.figure .l { color: var(--muted); font-size: 0.84rem; }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.group { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.group.state-done { border-color: var(--done); box-shadow: inset 0 3px 0 var(--done); }
.group.state-running, .group.state-queued { border-color: var(--run); box-shadow: inset 0 3px 0 var(--run); }
.group.state-failed { border-color: var(--fail); box-shadow: inset 0 3px 0 var(--fail); }
.group .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.group .k { font: 600 0.72rem/1.2 var(--ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.group .t { font-weight: 600; }
.item { display: grid; grid-template-columns: 12px 1fr; gap: 2px 8px; align-items: baseline; font-size: 0.88rem; }
.item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); align-self: center; }
.item .dot.done, .item .dot.finished { background: var(--done); }
.item .dot.running, .item .dot.watching, .item .dot.queued { background: var(--run); }
.item .dot.failed, .item .dot.stopped { background: var(--fail); }
.item .d { grid-column: 2; font: 0.74rem/1.35 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 22px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.reading { display: grid; gap: 6px; padding-block: 8px; border-top: 1px solid var(--line); }
.reading:first-of-type { border-top: 0; padding-top: 0; }
.row { display: flex; justify-content: space-between; gap: 10px; font-size: 0.9rem; }
.row .v { font: 0.84rem var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.bar { height: 10px; border-radius: 5px; background: var(--wait-soft); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.bar .b-done { background: var(--done); }
.bar .b-run { background: var(--run); }
.bar .b-fail { background: var(--fail); }
.kinds { font: 0.74rem/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.task { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding-block: 9px; border-top: 1px solid var(--line); }
.task:first-of-type { border-top: 0; padding-top: 0; }
.task .id { font: 600 0.9rem var(--mono); }
.task .sub { grid-column: 2 / 4; font: 0.76rem var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 0.9rem; margin: 0; }
svg text { fill: var(--muted); font: 11px var(--mono); }
.chart { width: 100%; height: auto; display: block; }
pre { margin: 0; font: 0.76rem/1.5 var(--mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.scroll { overflow-x: auto; }
footer { color: var(--muted); font-size: 0.8rem; max-width: 80ch; }
@media (prefers-reduced-motion: no-preference) { .bar span { transition: width 0.4s ease; } }
  .logrow { display: flex; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .logrow .at { font-variant-numeric: tabular-nums; color: var(--muted); flex: none; }
  .logrow.bad span:last-child { color: var(--fail); }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>DRR gap run</h1>
      <div class="meta" id="sub"></div>
    </div>
    <div class="meta" id="read"></div>
  </header>
  <div class="note" id="note"></div>
  <section class="figures" id="figures" aria-label="Where the run stands"></section>
  <section class="panel">
    <h2>Pipeline</h2>
    <div class="strip" id="strip"></div>
  </section>
  <div class="cols">
    <section class="panel"><h2>Units by reading</h2><div id="readings"></div></section>
    <section class="panel"><h2>Array tasks</h2><div id="tasks"></div></section>
  </div>
  <section class="panel">
    <h2>Units done over time</h2>
    <div class="scroll" id="chart"></div>
  </section>
  <section class="panel">
    <h2>Run log, newest last (UTC)</h2>
    <div id="log"></div>
  </section>
  <section class="panel">
    <h2>Last progress read from the grid</h2>
    <pre id="lines"></pre>
  </section>
  <footer id="foot"></footer>
</div>

<script id="state" type="application/json">__STATE__</script>
<script>
(function () {
  var S = JSON.parse(document.getElementById("state").textContent);
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function pill(state, label) { return el("span", "pill s-" + (state || "none"), label || state || "none"); }
  function pct(n, t) { return t ? (100 * n / t) : 0; }

  document.getElementById("sub").textContent = S.subtitle;
  var read = document.getElementById("read");
  read.appendChild(pill(S.phase, S.phase_label));
  read.appendChild(document.createTextNode("  " + (S.progress_at ? "progress of " + S.progress_at + ", " : "") + "read " + S.updated));
  var note = document.getElementById("note"); note.appendChild(el("p", null, S.note));

  var figs = document.getElementById("figures");
  (S.figures || []).forEach(function (f) {
    var box = el("div", "figure"); box.appendChild(el("div", "n", f.value)); box.appendChild(el("div", "l", f.label)); figs.appendChild(box);
  });

  var strip = document.getElementById("strip");
  (S.pipeline || []).forEach(function (g) {
    var box = el("div", "group state-" + g.state);
    var top = el("div", "top"); top.appendChild(el("span", "k", g.job)); top.appendChild(pill(g.state)); box.appendChild(top);
    box.appendChild(el("span", "t", g.name));
    (g.items || []).forEach(function (it) {
      var row = el("div", "item"); row.appendChild(el("span", "dot " + it.state)); row.appendChild(el("span", null, it.name));
      if (it.detail) row.appendChild(el("span", "d", it.detail));
      box.appendChild(row);
    });
    strip.appendChild(box);
  });

  var readings = document.getElementById("readings");
  if (!(S.readings || []).length) readings.appendChild(el("p", "empty", "The readings and their units appear once prepare has listed them."));
  (S.readings || []).forEach(function (r) {
    var box = el("div", "reading");
    var row = el("div", "row"); row.appendChild(el("span", null, r.key));
    row.appendChild(el("span", "v", r.invalid ? "not read" : r.done + " of " + r.total));
    box.appendChild(row);
    if (r.invalid) { box.appendChild(el("span", "kinds", r.invalid)); readings.appendChild(box); return; }
    var bar = el("div", "bar");
    var d = el("span", "b-done"); d.style.width = pct(r.done, r.total) + "%"; bar.appendChild(d);
    box.appendChild(bar);
    box.appendChild(el("span", "kinds", (r.kinds || []).map(function (k) { return k.kind + " " + k.done + "/" + k.total; }).join("  ·  ")));
    readings.appendChild(box);
  });

  var tasks = document.getElementById("tasks");
  if (!(S.tasks || []).length) tasks.appendChild(el("p", "empty", "Each of the array's tasks appears here with its card, its counts and its last heartbeat once it starts."));
  (S.tasks || []).forEach(function (t) {
    var box = el("div", "task");
    box.appendChild(el("span", "id", "task " + t.task));
    box.appendChild(el("span", "v", t.done + " done, " + t.running + " running, " + t.failed + " failed"));
    box.appendChild(pill(t.state));
    box.appendChild(el("span", "sub", t.job + " on " + t.host + ", " + t.gpu + ", heartbeat " + t.beat));
    tasks.appendChild(box);
  });

  var chart = document.getElementById("chart"), H = S.history || [];
  if (H.length < 2) {
    chart.appendChild(el("p", "empty", "The trace starts with the second read of the run's progress: each read adds a point, units done against minutes since the first unit was done."));
  } else {
    var W = 1000, Ht = 240, L = 48, R = 16, T = 14, B = 30;
    var total = S.total_units || Math.max.apply(null, H.map(function (p) { return p.done; }));
    var maxX = Math.max(5, H[H.length - 1].minute);
    function x(m) { return L + (W - L - R) * m / maxX; }
    function y(n) { return T + (Ht - T - B) * (1 - n / total); }
    var ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + Ht); svg.setAttribute("class", "chart"); svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Units done over time");
    function add(name, attrs, text) { var e = document.createElementNS(ns, name); for (var k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; svg.appendChild(e); return e; }
    [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
      var n = Math.round(total * f);
      add("line", { x1: L, x2: W - R, y1: y(n), y2: y(n), stroke: "var(--line)", "stroke-width": 1 });
      add("text", { x: L - 6, y: y(n) + 4, "text-anchor": "end" }, String(n));
    });
    var step = maxX > 240 ? 60 : maxX > 60 ? 30 : 10;
    for (var m = 0; m <= maxX; m += step) add("text", { x: x(m), y: Ht - 10, "text-anchor": "middle" }, m + " min");
    var pts = H.map(function (p) { return x(p.minute) + "," + y(p.done); }).join(" ");
    add("polygon", { points: x(H[0].minute) + "," + y(0) + " " + pts + " " + x(H[H.length - 1].minute) + "," + y(0), fill: "var(--done-soft)" });
    add("polyline", { points: pts, fill: "none", stroke: "var(--done)", "stroke-width": 2 });
    var last = H[H.length - 1];
    add("circle", { cx: x(last.minute), cy: y(last.done), r: 4, fill: "var(--done)" });
    chart.appendChild(svg);
  }

  var log = document.getElementById("log");
  if (!(S.log || []).length) log.appendChild(el("p", "empty", "Each step writes a line as it starts, finishes a stage, takes over a stale unit or fails; the newest ten show here once the run starts."));
  (S.log || []).forEach(function (r) {
    var row = el("div", "logrow" + (/FAILED|ended by Slurm|died/.test(r.text) ? " bad" : ""));
    row.appendChild(el("span", "at", r.at)); row.appendChild(el("span", null, r.text)); log.appendChild(row);
  });

  document.getElementById("lines").textContent = (S.lines || []).join("\n") || "No progress has been read yet.";
  document.getElementById("foot").textContent = S.footer;
})();
</script>
