  read.appendChild(document.createTextNode("  " + (S.progress_at ? "progress of " + S.progress_at + ", " : "") + "read " + S.updated));
  var note = document.getElementById("note"); note.appendChild(el("p", null, S.note));

  var figs = document.getElementById("figures");
  (S.figures || []).forEach(function (f) {
    var box = el("div", "figure"); box.appendChild(el("div", "n", f.value)); box.appendChild(el("div", "l", f.label)); figs.appendChild(box);
  });

  var strip = document.getElementById("strip");
  (S.pipeline || []).forEach(function (g) {
    var box = el("div", "group state-" + g.state);
    var top = el("div", "top"); top.appendChild(el("span", "k", g.job)); top.appendChild(pill(g.state)); box.appendChild(top);
    box.appendChild(el("span", "t", g.name));
    (g.items || []).forEach(function (it) {
      var row = el("div", "item"); row.appendChild(el("span", "dot " + it.state)); row.appendChild(el("span", null, it.name));
      if (it.detail) row.appendChild(el("span", "d", it.detail));
      box.appendChild(row);
    });
    strip.appendChild(box);
  });

  var readings = document.getElementById("readings");
  if (!(S.readings || []).length) readings.appendChild(el("p", "empty", "The readings and their units appear once prepare has listed them."));
  (S.readings || []).forEach(function (r) {
    var box = el("div", "reading");
    var row = el("div", "row"); row.appendChild(el("span", null, r.key));
    row.appendChild(el("span", "v", r.invalid ? "not read" : r.done + " of " + r.total));
    box.appendChild(row);
    if (r.invalid) { box.appendChild(el("span", "kinds", r.invalid)); readings.appendChild(box); return; }
    var bar = el("div", "bar");
    var d = el("span", "b-done"); d.style.width = pct(r.done, r.total) + "%"; bar.appendChild(d);
    box.appendChild(bar);
    box.appendChild(el("span", "kinds", (r.kinds || []).map(function (k) { return k.kind + " " + k.done + "/" + k.total; }).join("  ·  ")));
    readings.appendChild(box);
  });

  var tasks = document.getElementById("tasks");
  if (!(S.tasks || []).length) tasks.appendChild(el("p", "empty", "Each of the array's tasks appears here with its card, its counts and its last heartbeat once it starts."));
  (S.tasks || []).forEach(function (t) {
    var box = el("div", "task");
    box.appendChild(el("span", "id", "task " + t.task));
    box.appendChild(el("span", "v", t.done + " done, " + t.running + " running, " + t.failed + " failed"));
    box.appendChild(pill(t.state));
    box.appendChild(el("span", "sub", t.job + " on " + t.host + ", " + t.gpu + ", heartbeat " + t.beat));
    tasks.appendChild(box);
  });

  var chart = document.getElementById("chart"), H = S.history || [];
  if (H.length < 2) {
    chart.appendChild(el("p", "empty", "The trace starts with the second read of the run's progress: each read adds a point, units done against minutes since the first unit was done."));
  } else {
    var W = 1000, Ht = 240, L = 48, R = 16, T = 14, B = 30;
    var total = S.total_units || Math.max.apply(null, H.map(function (p) { return p.done; }));
    var maxX = Math.max(5, H[H.length - 1].minute);
    function x(m) { return L + (W - L - R) * m / maxX; }
    function y(n) { return T + (Ht - T - B) * (1 - n / total); }
    var ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + Ht); svg.setAttribute("class", "chart"); svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Units done over time");
    function add(name, attrs, text) { var e = document.createElementNS(ns, name); for (var k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; svg.appendChild(e); return e; }
    [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
      var n = Math.round(total * f);
      add("line", { x1: L, x2: W - R, y1: y(n), y2: y(n), stroke: "var(--line)", "stroke-width": 1 });
      add("text", { x: L - 6, y: y(n) + 4, "text-anchor": "end" }, String(n));
    });
    var step = maxX > 240 ? 60 : maxX > 60 ? 30 : 10;
    for (var m = 0; m <= maxX; m += step) add("text", { x: x(m), y: Ht - 10, "text-anchor": "middle" }, m + " min");
    var pts = H.map(function (p) { return x(p.minute) + "," + y(p.done); }).join(" ");
    add("polygon", { points: x(H[0].minute) + "," + y(0) + " " + pts + " " + x(H[H.length - 1].minute) + "," + y(0), fill: "var(--done-soft)" });
    add("polyline", { points: pts, fill: "none", stroke: "var(--done)", "stroke-width": 2 });
    var last = H[H.length - 1];
    add("circle", { cx: x(last.minute), cy: y(last.done), r: 4, fill: "var(--done)" });
    chart.appendChild(svg);
  }

  var log = document.getElementById("log");
  if (!(S.log || []).length) log.appendChild(el("p", "empty", "Each step writes a line as it starts, finishes a stage, takes over a stale unit or fails; the newest ten show here once the run starts."));
  (S.log || []).forEach(function (r) {
    var row = el("div", "logrow" + (/FAILED|ended by Slurm|died/.test(r.text) ? " bad" : ""));
    row.appendChild(el("span", "at", r.at)); row.appendChild(el("span", null, r.text)); log.appendChild(row);
  });

  document.getElementById("lines").textContent = (S.lines || []).join("\n") || "No progress has been read yet.";
  document.getElementById("foot").textContent = S.footer;
})();
</script>
